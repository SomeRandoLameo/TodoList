<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Todo</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <div class="shell">

        <!-- ── SIDEBAR ── -->
        <aside class="sidebar">
            <div class="brand">Todo<br/><em>Lists</em></div>

            <div class="new-list-form">
                <span class="label">New list</span>
                <input type="text" v-model="newListName" placeholder="List name…"
                       @keyup.enter="createList"/>
                <button class="btn btn-gold" @click="createList"
                        :disabled="!newListName.trim() || creating">
                    <span v-if="creating"><span class="spin"></span></span>
                    <span v-else">+ Create</span>
                </button>
            </div>

            <div class="list-nav">
                <span class="label">Your lists</span>
                <div v-if="lists.length === 0" class="empty-hint">No lists yet.</div>
                <div v-for="list in lists" :key="list.id"
                     class="list-item"
                     :class="{ active: activeListId === list.id }"
                     @click="selectList(list.id)">
                    <span class="list-item-name">{{ list.name }}</span>
                    <button class="list-del" @click.stop="deleteList(list.id)" title="Delete list">✕</button>
                </div>
            </div>
        </aside>

        <!-- ── MAIN ── -->
        <main class="main">

            <!-- no list selected -->
            <div v-if="!activeListId" class="placeholder">
                <div class="placeholder-icon">📋</div>
                <p>Select a list on the left<br/>or create a new one to get started.</p>
            </div>

            <template v-else>
                <div class="main-header">
                    <span class="main-title">{{ activeList.name }}</span>
                    <span class="entry-count">{{ entries.length }} item{{ entries.length !== 1 ? 's' : '' }}</span>
                </div>

                <!-- add entry -->
                <div class="add-entry-form">
                    <span class="label">Add entry</span>
                    <div class="form-row">
                        <input type="text" v-model="newEntry.name" placeholder="Name…"
                               @keyup.enter="createEntry"/>
                        <input type="text" v-model="newEntry.description" placeholder="Description…"
                               @keyup.enter="createEntry"/>
                    </div>
                    <div>
                        <button class="btn btn-rust" @click="createEntry"
                                :disabled="!newEntry.name.trim() || addingEntry">
                            <span v-if="addingEntry"><span class="spin"></span></span>
                            <span v-else">+ Add</span>
                        </button>
                    </div>
                </div>

                <!-- entries -->
                <div v-if="loadingEntries" style="color:var(--muted);font-size:.8rem;">
                    <span class="spin"></span> Loading…
                </div>

                <div v-else-if="entries.length === 0" class="placeholder" style="padding:2rem 0;">
                    <div class="placeholder-icon">✏️</div>
                    <p>No entries yet. Add one above.</p>
                </div>

                <div v-else class="entries">
                    <div v-for="entry in entries" :key="entry.id" class="entry-card">

                        <!-- view mode -->
                        <div v-if="editingId !== entry.id" class="entry-body">
                            <div class="entry-name">{{ entry.name }}</div>
                            <div class="entry-desc" v-if="entry.description">{{ entry.description }}</div>
                            <div class="entry-id">{{ entry.id }}</div>
                        </div>

                        <!-- edit mode -->
                        <div v-else class="entry-body">
                            <div class="edit-row">
                                <input type="text" v-model="editForm.name" placeholder="Name…"/>
                                <textarea rows="2" v-model="editForm.description" placeholder="Description…"></textarea>
                                <div class="edit-actions">
                                    <button class="btn btn-gold" @click="saveEdit(entry.id)"
                                            :disabled="savingEdit">
                                        <span v-if="savingEdit"><span class="spin"></span></span>
                                        <span v-else">Save</span>
                                    </button>
                                    <button class="btn btn-ghost" @click="cancelEdit">Cancel</button>
                                </div>
                            </div>
                        </div>

                        <div class="entry-actions">
                            <button class="btn btn-ghost" style="font-size:.7rem;"
                                    @click="startEdit(entry)">Edit
                            </button>
                            <button class="btn btn-rust" style="font-size:.7rem;"
                                    @click="deleteEntry(entry.id)">Del
                            </button>
                        </div>

                    </div>
                </div>
            </template>
        </main>
    </div>

    <!-- toasts -->
    <div class="toast-wrap">
        <div v-for="t in toasts" :key="t.id" class="toast" :class="{ err: t.err }">
            {{ t.msg }}
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script>
   const BASE = '';

const app = Vue.createApp({

    data() {
        return {
            lists:          [],
            entries:        [],
            activeListId:   null,
            newListName:    '',
            newEntry:       { name: '', description: '' },
            editingId:      null,
            editForm:       { name: '', description: '' },
            toasts:         [],
            toastSeq:       0,
            creating:       false,
            addingEntry:    false,
            loadingEntries: false,
            savingEdit:     false,
        };
    },

    computed: {
        activeList() {
            return this.lists.find(l => l.id === this.activeListId) || {};
        },
    },

    methods: {

        // ── API helper ────────────────────────────────────────────────────────

        async api(path, opts = {}) {
            const res = await fetch(BASE + path, {
                headers: { 'Content-Type': 'application/json' },
                ...opts,
            });
            if (res.status === 204) return null;
            const json = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(json.message || `HTTP ${res.status}`);
            return json;
        },

        // ── Toast ─────────────────────────────────────────────────────────────

        toast(msg, err = false) {
            const id = ++this.toastSeq;
            this.toasts.push({ id, msg, err });
            setTimeout(() => {
                this.toasts = this.toasts.filter(t => t.id !== id);
            }, 3000);
        },

        // ── Lists ─────────────────────────────────────────────────────────────

        async createList() {
            if (!this.newListName.trim() || this.creating) return;
            this.creating = true;
            try {
                const list = await this.api('/todo-list', {
                    method: 'POST',
                    body: JSON.stringify({ name: this.newListName.trim() }),
                });
                this.lists.push(list);
                this.newListName = '';
                this.toast('List created');
                this.selectList(list.id);
            } catch (e) {
                this.toast(e.message, true);
            } finally {
                this.creating = false;
            }
        },

        async deleteList(id) {
            if (!confirm('Delete this list and all its entries?')) return;
            try {
                await this.api(`/todo-list/${id}`, { method: 'DELETE' });
                this.lists = this.lists.filter(l => l.id !== id);
                if (this.activeListId === id) {
                    this.activeListId = null;
                    this.entries = [];
                }
                this.toast('List deleted');
            } catch (e) {
                this.toast(e.message, true);
            }
        },

        async selectList(id) {
            this.activeListId = id;
            this.editingId = null;
            this.loadingEntries = true;
            try {
                this.entries = await this.api(`/todo-list/${id}`);
            } catch (e) {
                this.toast(e.message, true);
                this.entries = [];
            } finally {
                this.loadingEntries = false;
            }
        },

        // ── Entries ───────────────────────────────────────────────────────────

        async createEntry() {
            if (!this.newEntry.name.trim() || this.addingEntry) return;
            this.addingEntry = true;
            try {
                const entry = await this.api(`/todo-list/${this.activeListId}`, {
                    method: 'POST',
                    body: JSON.stringify({ ...this.newEntry }),
                });
                this.entries.unshift(entry);
                this.newEntry = { name: '', description: '' };
                this.toast('Entry added');
            } catch (e) {
                this.toast(e.message, true);
            } finally {
                this.addingEntry = false;
            }
        },

        async deleteEntry(id) {
            try {
                await this.api(`/entry/${id}`, { method: 'DELETE' });
                this.entries = this.entries.filter(e => e.id !== id);
                this.toast('Entry deleted');
            } catch (e) {
                this.toast(e.message, true);
            }
        },

        // ── Entry editing ─────────────────────────────────────────────────────

        startEdit(entry) {
            this.editingId = entry.id;
            this.editForm = { name: entry.name, description: entry.description || '' };
        },

        cancelEdit() {
            this.editingId = null;
        },

        async saveEdit(id) {
            if (this.savingEdit) return;
            this.savingEdit = true;
            try {
                const updated = await this.api(`/entry/${id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ ...this.editForm }),
                });
                const idx = this.entries.findIndex(e => e.id === id);
                if (idx !== -1) this.entries.splice(idx, 1, updated);
                this.editingId = null;
                this.toast('Entry updated');
            } catch (e) {
                this.toast(e.message, true);
            } finally {
                this.savingEdit = false;
            }
        },
    },
});

app.mount('#app');
</script>
</body>
</html>
